name: Run Ruby on Rails Tests and Static Analysis

on: [push, pull_request]

# Each job shows up as its own check on GitHub, so students can see
# which part failed. Static analysis counts for 20% of the grade.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Model and controller tests carried over from Assignment 3.
      MIN_RUNS: 35
      MIN_ASSERTIONS: 51
      # System tests: for each of the three tabs, create, edit, and delete
      # (9), plus at least 3 tests of the tabs themselves.
      MIN_SYSTEM_RUNS: 12
      MIN_SYSTEM_ASSERTIONS: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Set up Ruby. With no ruby-version given, setup-ruby uses the
      #    project's .ruby-version file, so CI matches what the student used.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # Runs 'bundle install' and caches gems

      # 2. React and Vue apps have a package.json; HTMX and Turbo apps use
      #    importmap and don't. Node only builds files into the app here;
      #    it never runs as a server.
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build JavaScript
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build --if-present

      # 3. Set up and seed the database.
      #    'bundle exec rails' works even when bin/rails was committed from
      #    Windows without the executable bit or with a ruby.exe shebang.
      #    db:migrate (not db:prepare, which also seeds a new database) so
      #    the seeds run once, as the README says.
      - name: Set up database
        run: bundle exec rails db:migrate

      - name: Seed the database
        run: bundle exec rails db:seed

      # 4. Run the tests. 'rails test' skips test/system, so the system
      #    tests get their own step and their own minimum. ubuntu-latest
      #    already has Chrome, and Selenium Manager finds the matching
      #    chromedriver. pipefail keeps a failure from being hidden by tee.
      - name: Run model and controller tests
        run: |
          set -o pipefail
          bundle exec rails test | tee test-output.txt

      - name: Run system tests (browser)
        run: |
          set -o pipefail
          bundle exec rails test:system | tee system-test-output.txt

      # 5. Require at least the assignment's tests and assertions, with no
      #    failures or errors.
      - name: Verify test output
        run: |
          # check FILE LABEL MIN_RUNS MIN_ASSERTIONS
          check() {
            summary=$(grep -E "[0-9]+ runs, [0-9]+ assertions" "$1" | tail -1)
            runs=$(echo "$summary" | sed -E 's/^([0-9]+) runs.*/\1/')
            assertions=$(echo "$summary" | sed -E 's/.* ([0-9]+) assertions.*/\1/')
            echo "$2: $summary"
            if echo "$summary" | grep -qE "(^|[^0-9])0 failures, 0 errors" \
               && [ "${runs:-0}" -ge "$3" ] && [ "${assertions:-0}" -ge "$4" ]; then
              echo "✓ $2 pass with at least $3 tests and $4 assertions"
            else
              echo "✗ $2: expected 0 failures, 0 errors, at least $3 tests, and at least $4 assertions"
              return 1
            fi
          }
          status=0
          check test-output.txt "Model and controller tests" "$MIN_RUNS" "$MIN_ASSERTIONS" || status=1
          check system-test-output.txt "System tests" "$MIN_SYSTEM_RUNS" "$MIN_SYSTEM_ASSERTIONS" || status=1
          exit $status

      # 6. Rails saves a screenshot of the browser for every failing system
      #    test. Download them from the run's Summary page.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: tmp/screenshots/
          if-no-files-found: ignore

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The analysis tools don't depend on the app's gems, so a fixed Ruby
      # and pinned tool versions give every student the same rules.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install RuboCop with the Rails omakase style
        run: gem install --no-document rubocop-rails-omakase -v 1.1.0

      # Use the standard Rails style for everyone, ignoring any local
      # .rubocop.yml, so loosening the rules doesn't change the result.
      - name: Lint code for consistent style
        env:
          BUNDLE_GEMFILE: ${{ runner.temp }}/no-Gemfile # keep the app's bundle out of it
        run: |
          style=$(gem contents rubocop-rails-omakase | grep '/rubocop.yml$' | head -1)
          cat > "$RUNNER_TEMP/rubocop.yml" <<EOF
          inherit_from:
            - $style
          AllCops:
            NewCops: disable
            SuggestExtensions: false
            Exclude:
              - "vendor/**/*"
              - "db/schema.rb"
              - "bin/**/*"
              - "tmp/**/*"
              - "node_modules/**/*"
          EOF
          rubocop -c "$RUNNER_TEMP/rubocop.yml" app config db lib test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Brakeman and bundler-audit
        run: gem install --no-document brakeman:8.1.0 bundler-audit:0.9.3

      # Brakeman checks the Rails code for security problems. The
      # end-of-life checks are skipped here because bundler-audit below
      # reports the dependencies that actually have known vulnerabilities.
      - name: Scan for Rails security vulnerabilities
        run: brakeman --no-pager --except CheckEOLRails,CheckEOLRuby

      - name: Scan gems for known vulnerabilities
        run: bundle-audit check --update

  # The app's JavaScript dependencies get their own check: npm packages
  # for React and Vue, importmap pins for HTMX and Turbo. bin/importmap
  # loads Rails, so this job needs the app's gems, not the security
  # job's fixed Ruby.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # React and Vue bring in npm packages, and their dependencies'
      # dependencies. Fail on high or critical advisories.
      - name: Set up Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Scan npm packages for known vulnerabilities
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high

      # Checks each pin's version (the '# @3.5.13' comment in
      # config/importmap.rb) against the npm advisory database. No Node.
      - name: Scan pinned JavaScript for known vulnerabilities
        if: hashFiles('config/importmap.rb') != ''
        run: bundle exec ruby bin/importmap audit # works without the executable bit
